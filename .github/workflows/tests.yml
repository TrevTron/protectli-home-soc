name: Local software checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-python:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - name: Software regression tests (no appliance or inference)
        run: python -m unittest discover -s tools -p 'test_*.py' -v
      - name: Parse PowerShell helpers without execution
        shell: pwsh
        run: |
          $taskParseFailures = @()
          Get-ChildItem -LiteralPath tools -Filter '*.ps1' | ForEach-Object {
            $taskTokens = $null
            $taskErrors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$taskTokens, [ref]$taskErrors)
            if ($taskErrors.Count) { $taskParseFailures += $taskErrors }
          }
          if ($taskParseFailures.Count) { $taskParseFailures | Write-Error; exit 1 }
